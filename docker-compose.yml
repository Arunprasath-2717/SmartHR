# ==============================================================================
# DAYFLOW - Docker Compose Configuration (FastAPI + Go AI Service)
# ==============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dayflow_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://dayflow_user:dayflow_password@db:5432/dayflow_db}
      AI_SERVICE_URL: http://ai-service:8080
      SECRET_KEY: ${SECRET_KEY:-dayflow_super_secret_jwt_key_for_dev_change_in_prod_12345}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - dayflow_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: dayflow_ai_service
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - dayflow_network

  db:
    image: postgres:15-alpine
    container_name: dayflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-dayflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayflow_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dayflow_user} -d ${POSTGRES_DB:-dayflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dayflow_network

volumes:
  postgres_data:
    name: dayflow_postgres_data

networks:
  dayflow_network:
    driver: bridge
