# ==============================================================================
# DAYFLOW - Docker Compose Configuration (Phase 0)
# ==============================================================================
# Services:
#   - db: PostgreSQL 15 Database with persistent storage and health check
#   - odoo: Odoo Community 17 with custom addons mount and persistent filestore
# ==============================================================================

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dayflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-dayflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayflow_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dayflow_user} -d ${POSTGRES_DB:-dayflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dayflow_network

  odoo:
    image: odoo:17.0
    container_name: dayflow_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: ${ODOO_DB_HOST:-db}
      PORT: ${ODOO_DB_PORT:-5432}
      USER: ${ODOO_DB_USER:-dayflow_user}
      PASSWORD: ${ODOO_DB_PASSWORD:-dayflow_password}
    ports:
      - "${ODOO_PORT:-8069}:8069"
    volumes:
      - ./backend/addons:/mnt/extra-addons
      - ./backend/config/odoo.conf:/etc/odoo/odoo.conf
      - odoo_data:/var/lib/odoo
    networks:
      - dayflow_network

volumes:
  postgres_data:
    name: dayflow_postgres_data
  odoo_data:
    name: dayflow_odoo_data

networks:
  dayflow_network:
    name: dayflow_network
    driver: bridge
