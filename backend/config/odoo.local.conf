[options]
; ==============================================================================
; DAYFLOW - Odoo 17 Local Windows Development Server Configuration
; ==============================================================================
; Points to local Dayflow addons and Odoo base addons.
; ==============================================================================

; Paths to addons directories (custom Dayflow addons first, followed by base Odoo addons)
addons_path = D:\SmartHR\backend\addons, D:\Odoo\odoo\addons

; Database connection parameters (reads defaults or environment settings)
db_host = localhost
db_port = 5432
db_user = dayflow_user
db_password = dayflow_password
db_name = False
db_template = template1

; Server HTTP port
http_port = 8069
http_enable = True

; Logging configuration
log_level = info
log_handler = [':INFO']
logfile = False

; Performance & worker parameters for local Windows development
workers = 0
limit_time_cpu = 120
limit_time_real = 240

; Security & Admin Master Password
admin_passwd = admin_master_dev_password

; Developer mode options
dev_mode = reload,qweb
