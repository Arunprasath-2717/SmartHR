[options]
; ==============================================================================
; DAYFLOW - Odoo 17 Development Server Configuration
; ==============================================================================
; Note: In containerized environments, values can be supplied via environment
; variables or mounted configuration files.
; ==============================================================================

; Paths to addons directories (comma-separated)
addons_path = /mnt/extra-addons, /usr/lib/python3/dist-packages/odoo/addons

; Database connection parameters
db_host = postgres
db_port = 5432
db_user = dayflow_user
db_password = dayflow_password
db_name = False
db_template = template1

; Server HTTP port
http_port = 8069
http_enable = True

; Logging configuration
log_level = info
log_handler = [':INFO']
logfile = False

; Performance & worker parameters for local development
workers = 0
limit_time_cpu = 120
limit_time_real = 240
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; Data directory for filestore & sessions
data_dir = /var/lib/odoo

; Security & Admin Master Password placeholder (CHANGE IN PRODUCTION)
admin_passwd = admin_master_dev_password

; Developer mode options (reload assets, tests, etc.)
dev_mode = reload,qweb
