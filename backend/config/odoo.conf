[options]
; ==============================================================================
; DAYFLOW - Odoo 17 Development Server Configuration
; ==============================================================================
; Configured for Windows development environment with Dayflow addons.
; ==============================================================================

; Paths to addons directories (base Odoo addons first, followed by custom Dayflow addons)
addons_path = D:\Odoo\odoo\addons,D:\SmartHR\backend\addons

; Database connection parameters
db_host = localhost
db_port = 5432
db_user = dayflow_user
db_password = dayflow_password
db_name = False
db_template = template1

; Server HTTP port
http_port = 8069
http_enable = True

; Logging configuration
log_level = info
log_handler = :INFO
logfile = False

; Performance & worker parameters for local development
workers = 0
limit_time_cpu = 120
limit_time_real = 240
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; Data directory for filestore & sessions on Windows
data_dir = D:\Odoo\odoo-data

; Security & Admin Master Password
admin_passwd = admin_master_dev_password

; Developer mode options (reload assets, tests, etc.)
dev_mode = reload,qweb
